name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        timeout-minutes: 5

      - name: Install Chromium for the DOM tests
        run: pnpm --filter @mcp-web/tests exec playwright install --with-deps chromium

      - name: Test in the browser
        run: pnpm --filter @mcp-web/tests test:dom --project=chromium
        timeout-minutes: 5
