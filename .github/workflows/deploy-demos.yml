name: Deploy Demos

on:
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - 'packages/**'
      - '.github/workflows/deploy-demos.yml'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Demo to deploy (all, higlass, todo, checkers)'
        required: false
        default: 'all'

concurrency:
  group: deploy-demos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # Deploys are independent, but a failure should not hide the others
      fail-fast: false
      matrix:
        demo: [higlass, todo, checkers]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build:packages

      - name: Build demo frontend
        run: |
          cd demos/${{ matrix.demo }}
          cp ../deploy/${{ matrix.demo }}/mcp-web.config.ts ./mcp-web.config.ts
          pnpm build

      - name: Deploy bridge worker
        if: >-
          github.event_name == 'push' ||
          inputs.demo == 'all' ||
          inputs.demo == matrix.demo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: demos/deploy
          command: deploy --config ${{ matrix.demo }}/wrangler.jsonc

      - name: Deploy checkers agent worker
        if: >-
          matrix.demo == 'checkers' && (
            github.event_name == 'push' ||
            inputs.demo == 'all' ||
            inputs.demo == 'checkers'
          )
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: demos/deploy
          command: deploy --config checkers/wrangler.agent.jsonc
